name: Fix engineering allocation validation once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-engineering-allocation-scope-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch allocation validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/modules/engineering/ui/EngineeringContractWorkspace.tsx')
          s=p.read_text()
          old="const nextQuantity=numberValue(allocationEdit.quantity);"
          new="const nextQuantity=allocationEdit.unit.trim().toLocaleUpperCase('pt-BR')==='APTO'&&allocationEdit.unitsPerFloor>0&&allocationEdit.selectedFloors.length>0?allocationEdit.selectedFloors.length*allocationEdit.unitsPerFloor:numberValue(allocationEdit.quantity);"
          if old not in s: raise SystemExit('save quantity fragment not found')
          s=s.replace(old,new,1)
          old="function toggleAllocationFloor(floor:string){setAllocationError(null);setAllocationEdit(current=>{if(!current)return current;const selected=current.selectedFloors.includes(floor)?current.selectedFloors.filter(item=>item!==floor):[...current.selectedFloors,floor];const derived=current.unit.trim().toLocaleUpperCase('pt-BR')==='APTO'&&current.unitsPerFloor>0?selected.length*current.unitsPerFloor:numberValue(current.quantity);return {...current,selectedFloors:selected,quantity:String(derived)};});}"
          new="function toggleAllocationFloor(floor:string){setAllocationEdit(current=>{if(!current)return current;const selected=current.selectedFloors.includes(floor)?current.selectedFloors.filter(item=>item!==floor):[...current.selectedFloors,floor];const derived=current.unit.trim().toLocaleUpperCase('pt-BR')==='APTO'&&current.unitsPerFloor>0?selected.length*current.unitsPerFloor:numberValue(current.quantity);setAllocationError(derived>current.maxQuantity?`O máximo contratado para este serviço é ${quantity.format(current.maxQuantity)}. Selecione apenas os pavimentos que pertencem ao seu escopo.`:null);return {...current,selectedFloors:selected,quantity:String(derived)};});}"
          if old not in s: raise SystemExit('toggle fragment not found')
          s=s.replace(old,new,1)
          old="{allocationError&&<div className=\"engineering-allocation-editor__error\" role=\"alert\">{allocationError}</div>}"
          new="{allocationError&&(!allocationError.startsWith('O máximo contratado')||numberValue(allocationEdit.quantity)>allocationEdit.maxQuantity)&&<div className=\"engineering-allocation-editor__error\" role=\"alert\">{allocationError}</div>}"
          if old not in s: raise SystemExit('error render fragment not found')
          s=s.replace(old,new,1)
          old="<Button disabled={allocationSaving||numberValue(allocationEdit.quantity)<=0} onClick={()=>void saveAllocationEdit()}>"
          new="<Button disabled={allocationSaving||numberValue(allocationEdit.quantity)<=0||numberValue(allocationEdit.quantity)>allocationEdit.maxQuantity} onClick={()=>void saveAllocationEdit()}>"
          if old not in s: raise SystemExit('save button fragment not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          npm ci
          npm run typecheck
          npm run lint
          npm test -- --run
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/engineering/ui/EngineeringContractWorkspace.tsx
          git commit -m "fix(engineering): recalculate allocation validation live"
          git push
