name: New measurement reset once
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-new-measurement-reset.py'
      - '.github/workflows/new-measurement-reset-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply new measurement reset
        run: python scripts/patch-new-measurement-reset.py
      - name: Install dependencies
        run: npm install
      - name: Verify
        run: |
          node scripts/architecture-guard.mjs
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/patch-new-measurement-reset.py .github/workflows/new-measurement-reset-once.yml
          git add src/modules/engineering/ui/EngineeringContractWorkspace.tsx
          git commit -m 'fix(engineering): isolate new measurement from existing drafts'
          git push
