name: Engineering tower configuration once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/engineering-tower-config-once.yml'
      - 'scripts/patch-engineering-tower-config.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python scripts/patch-engineering-tower-config.py
      - name: Install dependencies
        run: npm install
      - name: Verify
        run: |
          node scripts/architecture-guard.mjs
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/engineering
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(engineering): configure tower structure from contract tab'
          git push
