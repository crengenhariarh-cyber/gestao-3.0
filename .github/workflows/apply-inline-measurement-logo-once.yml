name: Apply inline measurement logo once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-inline-measurement-logo-once.yml'
      - 'scripts/fix-measurement-print-inline-logo.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Android-safe inline company logo
        run: python3 scripts/fix-measurement-print-inline-logo.py
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Persist repair
        run: |
          # Commit only the audited source repair; this workflow does not alter measurement data.
          if git diff --quiet; then
            echo "Repair already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/engineering/ui/GuidedMeasurementFlow.tsx
          git commit -m "fix(engineering): embed company logo before Android print"
          git push origin main
