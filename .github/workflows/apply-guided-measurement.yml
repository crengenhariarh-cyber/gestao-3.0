name: Apply guided measurement integration
on:
  push:
    paths:
      - '.github/workflows/apply-guided-measurement.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch engineering measurement flow
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'pattern not found in {path}: {old[:100]}')
              p.write_text(s.replace(old,new,1))

          domain='src/modules/engineering/application/EngineeringOperationsRepository.ts'
          replace_once(domain,
            "  structures: readonly (EngineeringReferenceItem & { workId: string })[];",
            "  structures: readonly (EngineeringReferenceItem & { workId:string; parentId:string|null; type:string; code:string|null })[];\n  allocations: readonly { id:string; contractServiceId:string; structureId:string; allocatedQuantity:number; status:string }[];\n  measurementLines: readonly { id:string; measurementId:string; contractServiceId:string; structureId:string|null; measuredQuantity:number; grossValue:number }[];")

          repo='src/modules/engineering/infrastructure/SupabaseEngineeringOperationsRepository.ts'
          replace_once(repo,
            "type StructureRow={id:string;name:string;work_id:string};",
            "type StructureRow={id:string;name:string;work_id:string;parent_id:string|null;structure_type:string;code:string|null};")
          replace_once(repo,
            "type AddendumRow={id:string;contract_id:string;addendum_number:string;status:string};",
            "type AddendumRow={id:string;contract_id:string;addendum_number:string;status:string};\ntype AllocationRow={id:string;contract_service_id:string;structure_id:string;allocated_quantity:number|string;status:string};\ntype MeasurementLineRow={id:string;measurement_id:string;contract_service_id:string;structure_id:string|null;measured_quantity:number|string;gross_value:number|string};")
          replace_once(repo,
            "const [works,structures,services,contracts,contractServices,measurements,periods,employees,provisionals,provisionalLines,addenda,accounts]=await Promise.all([",
            "const [works,structures,services,contracts,contractServices,measurements,periods,employees,provisionals,provisionalLines,addenda,accounts,allocations,measurementLines]=await Promise.all([")
          replace_once(repo,
            "this.client.from('work_structures').select('id,name,work_id')",
            "this.client.from('work_structures').select('id,name,work_id,parent_id,structure_type,code')")
          replace_once(repo,
            "      this.client.from('financial_account_balances').select('account_id,name,status').eq('tenant_id',scope.tenantId).eq('company_id',scope.companyId).eq('status','active').order('name').returns<AccountRow[]>(),\n    ]);",
            "      this.client.from('financial_account_balances').select('account_id,name,status').eq('tenant_id',scope.tenantId).eq('company_id',scope.companyId).eq('status','active').order('name').returns<AccountRow[]>(),\n      this.client.from('contract_service_allocations').select('id,contract_service_id,structure_id,allocated_quantity,status').eq('tenant_id',scope.tenantId).eq('company_id',scope.companyId).eq('status','active').returns<AllocationRow[]>(),\n      this.client.from('measurement_lines').select('id,measurement_id,contract_service_id,structure_id,measured_quantity,gross_value').eq('tenant_id',scope.tenantId).eq('company_id',scope.companyId).returns<MeasurementLineRow[]>(),\n    ]);")
          replace_once(repo,
            "const error=[works.error,structures.error,services.error,contracts.error,contractServices.error,measurements.error,periods.error,employees.error,provisionals.error,provisionalLines.error,addenda.error,accounts.error].find(Boolean);",
            "const error=[works.error,structures.error,services.error,contracts.error,contractServices.error,measurements.error,periods.error,employees.error,provisionals.error,provisionalLines.error,addenda.error,accounts.error,allocations.error,measurementLines.error].find(Boolean);")
          replace_once(repo,
            "structures:(structures.data??[]).map(row=>({id:row.id,name:row.name,workId:row.work_id})),",
            "structures:(structures.data??[]).map(row=>({id:row.id,name:row.name,workId:row.work_id,parentId:row.parent_id,type:row.structure_type,code:row.code})),\n      allocations:(allocations.data??[]).map(row=>({id:row.id,contractServiceId:row.contract_service_id,structureId:row.structure_id,allocatedQuantity:Number(row.allocated_quantity),status:row.status})),\n      measurementLines:(measurementLines.data??[]).map(row=>({id:row.id,measurementId:row.measurement_id,contractServiceId:row.contract_service_id,structureId:row.structure_id,measuredQuantity:Number(row.measured_quantity),grossValue:Number(row.gross_value)})),")

          workspace='src/modules/engineering/ui/EngineeringContractWorkspace.tsx'
          replace_once(workspace,
            "import { EngineeringOperationsPanel } from './EngineeringOperationsPanel';",
            "import { EngineeringOperationsPanel } from './EngineeringOperationsPanel';\nimport { GuidedMeasurementFlow } from './GuidedMeasurementFlow';")
          replace_once(workspace,
            "  const [formKind,setFormKind]=useState<FormKind|null>(null);",
            "  const [formKind,setFormKind]=useState<FormKind|null>(null);\n  const [guidedMeasurementOpen,setGuidedMeasurementOpen]=useState(false);")
          replace_once(workspace,
            "  function open(kind:FormKind){setFormKind(kind);}",
            "  function open(kind:FormKind){if(kind==='measurementLine'){setGuidedMeasurementOpen(true);return;}setFormKind(kind);}")
          replace_once(workspace,
            "onDialogClosed={()=>setFormKind(null)}/></div></div></div>}</>;\n}",
            "onDialogClosed={()=>setFormKind(null)}/></div></div></div>}{guidedMeasurementOpen&&<GuidedMeasurementFlow scope={scope} contractId={contract.contractId} onChanged={changed} onClose={()=>setGuidedMeasurementOpen(false)}/>}</>;\n}")
          PY
      - name: Validate changes
        run: |
          git diff --check
          npm install --no-package-lock
          npm run typecheck
          npm run lint
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/engineering
          git commit -m "feat(engineering): port sequential measurement flow from Gestão 2.0"
          git push
