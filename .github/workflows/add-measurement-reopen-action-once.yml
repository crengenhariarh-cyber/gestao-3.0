name: Add measurement reopen action once

on:
  push:
    paths:
      - '.github/workflows/add-measurement-reopen-action-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add reopen action to measurements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/modules/engineering/ui/EngineeringContractWorkspace.tsx')
          s = path.read_text(encoding='utf-8')

          state_anchor = "  const [measurementDeleteId,setMeasurementDeleteId]=useState<string|null>(null);"
          state_new = state_anchor + "\n  const [measurementReopenId,setMeasurementReopenId]=useState<string|null>(null);\n  const [measurementReopening,setMeasurementReopening]=useState(false);"
          if 'measurementReopenId' not in s:
              if state_anchor not in s:
                  raise SystemExit('measurement state anchor not found')
              s = s.replace(state_anchor, state_new, 1)

          fn_anchor = "  async function confirmDeleteMeasurement(){if(!measurementDeleteId)return;await operations.deleteMeasurement(measurementDeleteId);setMeasurementDeleteId(null);onChanged();}"
          fn_new = fn_anchor + "\n  async function confirmReopenMeasurement(){if(!measurementReopenId||measurementReopening)return;setMeasurementReopening(true);try{await operations.setMeasurementStatus(measurementReopenId,'reopen','Reabertura manual de medição fechada');setMeasurementReopenId(null);onChanged();await operations.reload();}finally{setMeasurementReopening(false);}}"
          if 'confirmReopenMeasurement' not in s:
              if fn_anchor not in s:
                  raise SystemExit('measurement delete function anchor not found')
              s = s.replace(fn_anchor, fn_new, 1)

          old_actions = '<div className="engineering-sheet__row-actions"><Button size="sm" variant="tertiary" disabled={item.status!==\'draft\'} onClick={()=>openExistingMeasurement(item.id)}>Editar</Button><Button size="sm" variant="secondary" disabled={item.status!==\'draft\'} onClick={()=>setMeasurementDeleteId(item.id)}>Excluir</Button></div>'
          new_actions = '<div className="engineering-sheet__row-actions"><Button size="sm" variant="tertiary" disabled={item.status!==\'draft\'} onClick={()=>openExistingMeasurement(item.id)}>Editar</Button><Button size="sm" variant="secondary" disabled={item.status!==\'draft\'} onClick={()=>setMeasurementDeleteId(item.id)}>Excluir</Button>{item.status===\'closed\'&&<Button size="sm" variant="secondary" onClick={()=>setMeasurementReopenId(item.id)}>Reabrir</Button>}</div>'
          if 'setMeasurementReopenId(item.id)' not in s:
              if old_actions not in s:
                  raise SystemExit('measurement row actions anchor not found')
              s = s.replace(old_actions, new_actions, 1)

          dialog_anchor = '{measurementDeleteId&&<Dialog open title="Excluir medição" description="Esta ação apaga o rascunho e todos os itens medidos desta medição." onClose={()=>setMeasurementDeleteId(null)} onBack={()=>setMeasurementDeleteId(null)} onConfirm={()=>void confirmDeleteMeasurement()} confirmLabel="Excluir medição"><p>Confirme somente se esta medição foi criada ou lançada incorretamente.</p></Dialog>}'
          reopen_dialog = dialog_anchor + '{measurementReopenId&&<Dialog open title="Reabrir medição" description="A medição voltará para rascunho e poderá ser editada novamente. Nenhum serviço ou valor será apagado." loading={measurementReopening} onClose={()=>!measurementReopening&&setMeasurementReopenId(null)} onBack={()=>!measurementReopening&&setMeasurementReopenId(null)} onConfirm={()=>void confirmReopenMeasurement()} confirmLabel="Reabrir medição"><p>Use esta opção quando uma medição tiver sido fechada por engano.</p></Dialog>}'
          if 'title="Reabrir medição"' not in s:
              if dialog_anchor not in s:
                  raise SystemExit('measurement delete dialog anchor not found')
              s = s.replace(dialog_anchor, reopen_dialog, 1)

          path.write_text(s, encoding='utf-8')
          PY

      - name: Validate build
        run: npm install --no-package-lock && npm run build

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/engineering/ui/EngineeringContractWorkspace.tsx
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'feat(engineering): allow reopening closed measurements'
          git pull --rebase origin main
          git push origin HEAD:main
