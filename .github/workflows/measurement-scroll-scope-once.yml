name: Measurement scroll and scope once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/measurement-scroll-scope-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply fixes
        run: python scripts/patch-measurement-scroll-and-scope.py
      - name: Install dependencies
        run: npm install
      - name: Verify
        run: |
          node scripts/architecture-guard.mjs
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/engineering/ui/GuidedMeasurementFlow.tsx src/modules/engineering/infrastructure/LegacyMeasurementParityRepository.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(engineering): scroll measurement table and ignore stale scopes'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
