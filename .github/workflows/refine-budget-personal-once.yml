name: Refine personal budget once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-budget-personal-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply personal budget refinements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/modules/budget/ui/BudgetWorkspacePageImpl.tsx')
          s=p.read_text()
          def rep(old,new):
              global s
              if old not in s:
                  raise SystemExit(f'Missing expected fragment: {old[:120]}')
              s=s.replace(old,new,1)

          rep("import { Input } from '../../../shared/ui/Input';", "import { Input } from '../../../shared/ui/Input';\nimport { MoneyInput } from '../../../shared/ui/MoneyInput';")
          rep(" const company=useMemo(()=>companies.find(item=>item.id===companyId)??companies[0],[companies,companyId]);\n const scopeTenantId=company?.tenantId??'';", " const company=useMemo(()=>companies.find(item=>item.id===companyId)??companies[0],[companies,companyId]);\n const isPersonal=company?companyLabel(company)==='Pessoal':false;\n const personalCostCenterId=costCenters.find(item=>item.name.trim().toLocaleUpperCase('pt-BR')==='PESSOAL')?.id??'';\n const scopeTenantId=company?.tenantId??'';")
          rep(" function openNewItem(flowType:FlowType,categoryId='',costCenterId=selectedCostCenterId){", " function openNewItem(flowType:FlowType,categoryId='',costCenterId=isPersonal?personalCostCenterId:selectedCostCenterId){")
          rep("<span>{row.costCenterId?costCenterMap.get(row.costCenterId)??'Centro de custo':'Geral'}{flowType==='expense'?` · ${treatmentLabel(row.treatment)}`:''}</span>", "<span>{isPersonal?'Orçamento pessoal':<>{row.costCenterId?costCenterMap.get(row.costCenterId)??'Centro de custo':'Geral'}{flowType==='expense'?` · ${treatmentLabel(row.treatment)}`:''}</>}</span>")
          rep('return <section className="budget-workspace" aria-label="Orçamento">', 'return <section className={`budget-workspace${isPersonal?\' budget-workspace--personal\':\'\'}`} aria-label="Orçamento">')
          rep("<Select label=\"Obra / centro de custo\" value={selectedCostCenterId} onChange={event=>setSelectedCostCenterId(event.target.value)} options={[{value:'',label:'Todos / geral'},...costCenters.map(item=>({value:item.id,label:item.name}))]}/>", "{!isPersonal&&<Select label=\"Obra / centro de custo\" value={selectedCostCenterId} onChange={event=>setSelectedCostCenterId(event.target.value)} options={[{value:'',label:'Todos / geral'},...costCenters.map(item=>({value:item.id,label:item.name}))]}/>}" )
          rep('<span>Saídas operacionais</span>', "<span>{isPersonal?'Despesas':'Saídas operacionais'}</span>")
          rep('<span>Resultado operacional</span>', "<span>{isPersonal?'Saldo':'Resultado operacional'}</span>")
          rep('<span>Margem</span>', "<span>{isPersonal?'Renda livre':'Margem'}</span>")
          rep('<div className="budget-workspace__columns"><Card title="Entradas previstas × realizadas" description={`A entrada prevista é um valor anual global e será dividida por ${monthsInPlan} ${monthsInPlan===1?\'mês\':\'meses\'}.`}', '<div className="budget-workspace__columns"><Card title={isPersonal?"Receitas previstas × realizadas":"Entradas previstas × realizadas"} description={isPersonal?`Compare a renda planejada com os recebimentos efetivos ao longo de ${monthsInPlan} ${monthsInPlan===1?\'mês\':\'meses\'}.`:`A entrada prevista é um valor anual global e será dividida por ${monthsInPlan} ${monthsInPlan===1?\'mês\':\'meses\'}.`}')
          rep('<Card title="Custos e despesas previstas × realizadas" description="Somente itens classificados como custo operacional ou custo tributário compõem o custo da obra."', '<Card title={isPersonal?"Despesas previstas × realizadas":"Custos e despesas previstas × realizadas"} description={isPersonal?"Compare o valor planejado de cada categoria com o que já foi efetivamente pago.":"Somente itens classificados como custo operacional ou custo tributário compõem o custo da obra."}')
          rep('  <Card title={`Retenções / deduções${retentionCount?` · ${retentionCount}`:\'\'}`} description="Itens explicitamente classificados como retenção não reduzem o resultado operacional e não entram no custo usado para aplicar o acréscimo.">{budgetList(\'expense\',true)}</Card>', '  {!isPersonal&&<Card title={`Retenções / deduções${retentionCount?` · ${retentionCount}`:\'\'}`} description="Itens explicitamente classificados como retenção não reduzem o resultado operacional e não entram no custo usado para aplicar o acréscimo.">{budgetList(\'expense\',true)}</Card>}')
          rep('<Card title="Categorias e valores previstos" description="A categoria define o nome. A classificação financeira é definida em cada previsão por obra/centro de custo e ano."', '<Card title="Categorias e valores previstos" description={isPersonal?"Organize suas receitas e despesas por categoria e defina os valores previstos.":"A categoria define o nome. A classificação financeira é definida em cada previsão por obra/centro de custo e ano."}')
          rep('<Select label="Tratamento no orçamento" value={itemDraft.treatment} onChange={event=>setItemDraft({...itemDraft,treatment:event.target.value as Treatment})} options={[{value:\'operational_cost\',label:\'Custo operacional — compõe o custo da obra\'},{value:\'tax_cost\',label:\'Imposto / custo tributário — compõe o custo\'},{value:\'retention\',label:\'Retenção / dedução — não compõe o custo\'}]}/>', '{!isPersonal&&<Select label="Tratamento no orçamento" value={itemDraft.treatment} onChange={event=>setItemDraft({...itemDraft,treatment:event.target.value as Treatment})} options={[{value:\'operational_cost\',label:\'Custo operacional — compõe o custo da obra\'},{value:\'tax_cost\',label:\'Imposto / custo tributário — compõe o custo\'},{value:\'retention\',label:\'Retenção / dedução — não compõe o custo\'}]}/>}')
          rep('<Select label="Obra / centro de custo" value={itemDraft.costCenterId} onChange={event=>{const costCenterId=event.target.value;setItemFeedback(null);setItemDraft({...itemDraft,costCenterId,treatment:itemDraft.flowType===\'expense\'?treatmentFor(itemDraft.categoryId||null,costCenterId||null):itemDraft.treatment});}} options={[{value:\'\',label:\'Geral / sem obra\'},...costCenters.map(item=>({value:item.id,label:item.name}))]}/>', '{!isPersonal&&<Select label="Obra / centro de custo" value={itemDraft.costCenterId} onChange={event=>{const costCenterId=event.target.value;setItemFeedback(null);setItemDraft({...itemDraft,costCenterId,treatment:itemDraft.flowType===\'expense\'?treatmentFor(itemDraft.categoryId||null,costCenterId||null):itemDraft.treatment});}} options={[{value:\'\',label:\'Geral / sem obra\'},...costCenters.map(item=>({value:item.id,label:item.name}))]}/>}')
          rep('<Input label="Valor anual previsto" type="number" min="0" step="0.01" value={itemDraft.amount} onChange={event=>{setItemFeedback(null);setItemDraft({...itemDraft,amount:event.target.value});}}/>', '<MoneyInput label="Valor anual previsto" value={draftAnnual} onValueChange={value=>{setItemFeedback(null);setItemDraft({...itemDraft,amount:String(value)});}}/>')
          rep('description="A categoria será exclusiva da empresa selecionada. O tratamento como custo, imposto ou retenção é definido na previsão, não pelo nome da categoria."', 'description={isPersonal?"A categoria será exclusiva do seu orçamento pessoal.":"A categoria será exclusiva da empresa selecionada. O tratamento como custo, imposto ou retenção é definido na previsão, não pelo nome da categoria."}')

          p.write_text(s)
          PY
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/budget/ui/BudgetWorkspacePageImpl.tsx
          git diff --cached --quiet && exit 1
          git commit -m "refactor(budget): personalize personal budget flow"
          git push
