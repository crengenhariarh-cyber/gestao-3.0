name: Apply company measurement logo once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-company-measurement-logo-once.yml'
permissions:
  contents: write
jobs:
  apply-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply company logo to measurement print
        run: python3 scripts/fix-measurement-company-print-logo.py
      - name: Install dependencies
        run: npm install
      - name: Validate
        run: npm run typecheck && npm run lint && npm test && npm run build
      - name: Persist source
        run: |
          if git diff --quiet -- src/modules/engineering/ui/GuidedMeasurementFlow.tsx; then
            echo "Company print logo already persisted."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/modules/engineering/ui/GuidedMeasurementFlow.tsx
            git commit -m "fix(engineering): print measurement with company logo"
            git push
          fi
      - name: Deploy Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4 deploy
