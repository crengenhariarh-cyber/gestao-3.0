name: Add draft measurement print option once

on:
  push:
    paths:
      - '.github/workflows/add-draft-measurement-print-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch draft measurement print option
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          tsx = Path('src/modules/engineering/ui/GuidedMeasurementFlow.tsx')
          s = tsx.read_text(encoding='utf-8')

          old = '<footer className="approved-measurement-sheet__bottom-actions measurement-hub__footer"><Button variant="secondary" onClick={closeFlow}>Cancelar medição</Button><div><Button variant="secondary" disabled={headerSaving||!measurementId} onClick={()=>void saveHeader()}>{headerSaving?\'Salvando…\':\'▣ Salvar rascunho\'}</Button><Button disabled={headerSaving||!measurementId||measurementGross<=0} onClick={()=>void finalizeMeasurement()}>✓ Finalizar medição</Button></div></footer>'
          new = '<footer className="approved-measurement-sheet__bottom-actions measurement-hub__footer"><Button variant="secondary" onClick={closeFlow}>Cancelar medição</Button><div><Button className="measurement-print-action" variant="secondary" disabled={!activeMeasurementId||measurementGross<=0} onClick={()=>window.print()}>⎙ Imprimir medição</Button><Button variant="secondary" disabled={headerSaving||!measurementId} onClick={()=>void saveHeader()}>{headerSaving?\'Salvando…\':\'▣ Salvar rascunho\'}</Button><Button disabled={headerSaving||!measurementId||measurementGross<=0} onClick={()=>void finalizeMeasurement()}>✓ Finalizar medição</Button></div></footer>'

          if new not in s:
              if old not in s:
                  raise SystemExit('measurement footer anchor not found')
              s = s.replace(old, new, 1)
              tsx.write_text(s, encoding='utf-8')

          css = Path('src/modules/engineering/ui/guided-measurement-flow.css')
          c = css.read_text(encoding='utf-8')
          marker = '/* draft measurement print */'
          block = '''\n\n/* draft measurement print */\n@media print {\n  body * { visibility: hidden !important; }\n  .ui-dialog-backdrop,\n  .ui-dialog-backdrop *,\n  .ui-dialog[data-variant="measurement-fullscreen"],\n  .ui-dialog[data-variant="measurement-fullscreen"] * { visibility: visible !important; }\n  .ui-dialog-backdrop { position: static !important; inset: auto !important; background: #fff !important; padding: 0 !important; }\n  .ui-dialog[data-variant="measurement-fullscreen"] { position: static !important; width: 100% !important; max-width: none !important; height: auto !important; max-height: none !important; box-shadow: none !important; border: 0 !important; }\n  .ui-dialog[data-variant="measurement-fullscreen"] .ui-dialog__header,\n  .measurement-hub__footer,\n  .measurement-hub__selector,\n  .measurement-hub__origins button em { display: none !important; }\n  .measurement-hub { padding: 0 !important; }\n  .measurement-hub::before { content: "MEDIÇÃO EM RASCUNHO"; display: block; margin: 0 0 12px; font-size: 12px; font-weight: 800; letter-spacing: .12em; }\n  @page { size: A4 portrait; margin: 12mm; }\n}\n'''
          if marker not in c:
              css.write_text(c + block, encoding='utf-8')

          print('Draft measurement print option applied.')
          PY

      - name: Validate build
        run: npm install --no-package-lock && npm run build

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/engineering/ui/GuidedMeasurementFlow.tsx src/modules/engineering/ui/guided-measurement-flow.css
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'feat(engineering): allow printing draft measurements'
          git pull --rebase origin main
          git push origin HEAD:main
