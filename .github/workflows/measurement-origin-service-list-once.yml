name: Measurement origin service list once
on:
  push:
    branches: [main]
    paths:
      - scripts/patch-measurement-origin-service-list.py
      - .github/workflows/measurement-origin-service-list-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply service-list measurement flow
        run: python scripts/patch-measurement-origin-service-list.py
      - name: Install dependencies
        run: npm install
      - name: Verify
        run: |
          node scripts/architecture-guard.mjs
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/engineering/ui/GuidedMeasurementFlow.tsx src/modules/engineering/ui/guided-measurement-flow.css
          git commit -m "fix: restore service-first measurement origin flow"
          git push
