name: CI

# Measurement source is authoritative; official company logos are synced during CI/deploy.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  VITE_SUPABASE_URL: https://ogmtzxotpukddzowhqwl.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_vkhFOCSIvSbWifFCy6DjIg_9QJeYd38

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync official company logos
        run: node scripts/sync-official-company-logos.mjs

      - name: Use local official company logos in print
        run: python3 scripts/use-local-official-company-logos.py

      - name: Apply measurement navigation repair
        run: python3 scripts/fix-measurement-flow-navigation.py

      - name: Apply approved unit picker
        run: python3 scripts/apply-approved-unit-picker.py

      - name: Apply full tower measurement scope
        run: python3 scripts/fix-measurement-full-tower-scope.py

      - name: Apply launched-only measurement edit
        run: python3 scripts/fix-measurement-edit-launched-only.py

      - name: Isolate draft measurements
        run: python3 scripts/fix-measurement-draft-isolation.py

      - name: Apply automatic measurement sequence
        run: python3 scripts/fix-measurement-auto-sequence.py

      - name: Repair automatic sequence typecheck
        run: python3 scripts/fix-measurement-auto-sequence-typecheck.py

      - name: Apply measurement persistence consistency
        run: python3 scripts/fix-measurement-persistence-consistency.py

      - name: Lock measurement to selected draft
        run: python3 scripts/fix-measurement-active-id-lock.py

      - name: Persist measurement repairs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- src/modules/engineering/ui/GuidedMeasurementFlow.tsx src/modules/engineering/ui/guided-measurement-flow.css src/modules/engineering/ui/EngineeringOperationsPanel.tsx; then
            echo "Measurement source already updated."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/modules/engineering/ui/GuidedMeasurementFlow.tsx src/modules/engineering/ui/guided-measurement-flow.css src/modules/engineering/ui/EngineeringOperationsPanel.tsx
            git commit -m "fix(engineering): sync measurement repairs"
            git push
          fi

      - name: Install dependencies
        run: npm install

      - name: Architecture guard
        run: node scripts/architecture-guard.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy Cloudflare Workers
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync official company logos
        run: node scripts/sync-official-company-logos.mjs

      - name: Use local official company logos in print
        run: python3 scripts/use-local-official-company-logos.py

      - name: Apply measurement navigation repair
        run: python3 scripts/fix-measurement-flow-navigation.py

      - name: Apply approved unit picker
        run: python3 scripts/apply-approved-unit-picker.py

      - name: Apply full tower measurement scope
        run: python3 scripts/fix-measurement-full-tower-scope.py

      - name: Apply launched-only measurement edit
        run: python3 scripts/fix-measurement-edit-launched-only.py

      - name: Isolate draft measurements
        run: python3 scripts/fix-measurement-draft-isolation.py

      - name: Apply automatic measurement sequence
        run: python3 scripts/fix-measurement-auto-sequence.py

      - name: Repair automatic sequence typecheck
        run: python3 scripts/fix-measurement-auto-sequence-typecheck.py

      - name: Apply measurement persistence consistency
        run: python3 scripts/fix-measurement-persistence-consistency.py

      - name: Lock measurement to selected draft
        run: python3 scripts/fix-measurement-active-id-lock.py

      - name: Install dependencies
        run: npm install

      - name: Build production
        run: npm run build

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Validate Cloudflare session
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4 whoami

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          set -o pipefail
          max_attempts=3
          attempt=1
          until npx --yes wrangler@4 deploy; do
            exit_code=$?
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Cloudflare deploy failed after ${max_attempts} attempts."
              exit "$exit_code"
            fi
            wait_seconds=$((attempt * 20))
            echo "Cloudflare deploy attempt ${attempt} failed; retrying in ${wait_seconds}s..."
            sleep "$wait_seconds"
            attempt=$((attempt + 1))
          done
