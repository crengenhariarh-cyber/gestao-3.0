name: Fix engineering ground floor allocation once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-engineering-ground-floor-allocation-once.yml'
permissions:
  contents: write
  actions: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python scripts/patch-engineering-ground-floor-allocation.py
      - name: Install dependencies
        run: npm install
      - name: Verify
        run: |
          node scripts/architecture-guard.mjs
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/engineering/ui/EngineeringContractWorkspace.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(engineering): include ground floor in tower allocation'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Trigger production CI and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
