name: Measurement addendum descriptive labels once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/measurement-mobile-addendum-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply descriptive addendum labels
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/modules/engineering/ui/EngineeringOperationsPanel.tsx')
          s=p.read_text()
          old="label:`Aditivo · ${item.number}`"
          new="label:item.number"
          if old not in s:
              raise SystemExit('measurement addendum label target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Install dependencies
        run: npm install
      - name: Verify
        run: |
          node scripts/architecture-guard.mjs
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/engineering/ui/EngineeringOperationsPanel.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(engineering): use descriptive addendum labels in measurements'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
