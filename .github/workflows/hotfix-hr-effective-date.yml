name: HR effective date hotfix
on:
  push:
    paths:
      - '.github/workflows/hotfix-hr-effective-date.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve selected competence date in employee editor
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/modules/hr/ui/HrWorkspacePage.tsx')
          s = p.read_text()
          old = "costCenterId:employee.costCenterId??'',effectiveOn:localToday()"
          new = "costCenterId:employee.costCenterId??'',effectiveOn:competenceMonth"
          if old not in s:
              raise SystemExit('target expression not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/hr/ui/HrWorkspacePage.tsx
          git commit -m 'fix(hr): preserve effective date when reopening employee'
          git push
