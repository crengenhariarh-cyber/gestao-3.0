name: One-time budget flow repair

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_budget_sequence.py'
      - '.github/workflows/patch-budget-sequence.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply budget repair
        run: python scripts/patch_budget_sequence.py
      - name: Commit repaired budget flow
        run: |
          rm -f scripts/patch_budget_sequence.py .github/workflows/patch-budget-sequence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(budget): keep sequential entry flow and repair mobile layout"
          git push origin HEAD:main
