name: Engineering contract modals once

# one-time migration of contract sheets to nested dialogs
# keep parent sheet modal open after saving quantity
# make contract addenda prominent and clickable
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/engineering-contract-modals-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch
        run: python scripts/patch-engineering-contract-modals.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Verify
        run: |
          node scripts/architecture-guard.mjs
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/engineering/ui/EngineeringContractWorkspace.tsx
          git commit -m "fix(engineering): open addenda from contract tab"
          git push
