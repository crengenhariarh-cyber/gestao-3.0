name: Fix measurement print rendering once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch print rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/modules/engineering/ui/GuidedMeasurementFlow.tsx')
          s=p.read_text(encoding='utf-8')
          anchor="  function closeFlow(){onClose();}"
          fn=r'''  function printMeasurement(){
    const source=document.querySelector<HTMLElement>('.measurement-hub');
    if(!source){setError('Não foi possível preparar a impressão da medição.');return;}
    const clone=source.cloneNode(true) as HTMLElement;
    clone.querySelectorAll('.measurement-hub__footer,.measurement-hub__origin-picker,.measurement-print-action').forEach(node=>node.remove());
    clone.querySelectorAll('button em').forEach(node=>node.remove());
    const logo=new URL('/gestao-brand.svg',window.location.origin).href;
    const frame=document.createElement('iframe');
    frame.setAttribute('aria-hidden','true');
    frame.style.position='fixed';frame.style.right='0';frame.style.bottom='0';frame.style.width='1px';frame.style.height='1px';frame.style.border='0';frame.style.opacity='0';
    document.body.appendChild(frame);
    const doc=frame.contentDocument;
    if(!doc){frame.remove();setError('Não foi possível abrir a impressão.');return;}
    const statusLabel=model.measurements.find(item=>item.id===activeMeasurementId)?.status==='draft'?'RASCUNHO':'MEDIÇÃO';
    doc.open();
    doc.write(`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Medição ${header.measurementNumber||''}</title><style>
      *{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#111827;background:#fff;font-size:11px} .print-page{width:100%;padding:0}
      .print-head{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #1d4ed8;padding:0 0 12px;margin:0 0 16px}.print-head img{width:150px;max-height:54px;object-fit:contain;object-position:left center}.print-head__meta{text-align:right}.print-head__meta strong{display:block;font-size:18px}.print-head__meta span{display:block;margin-top:4px;font-weight:700;color:#b45309;letter-spacing:.08em}
      .measurement-hub{padding:0!important;display:block!important}.measurement-hub__header-card,.measurement-hub__financial,.measurement-hub__origins{break-inside:avoid;margin-bottom:14px}.measurement-hub__header-card{border:1px solid #d1d5db;border-radius:10px;padding:12px}.measurement-hub__header-title{display:flex;justify-content:space-between;gap:16px}.measurement-hub__header-title small{font-weight:800;color:#1d4ed8}.measurement-hub__header-title h3{margin:4px 0;font-size:16px}.measurement-hub__header-title p{margin:0;color:#6b7280}.measurement-hub__header-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.measurement-hub__header-grid label{font-size:9px;color:#6b7280}.measurement-hub__header-grid input,.measurement-hub__header-grid select{width:100%;border:1px solid #d1d5db;border-radius:6px;padding:6px;background:#fff;color:#111827;font:inherit}
      .measurement-hub__financial{display:grid!important;grid-template-columns:repeat(5,1fr)!important;gap:8px!important}.measurement-hub__financial>div{border:1px solid #d1d5db;border-radius:8px;padding:9px}.measurement-hub__financial span{display:block;color:#6b7280;font-size:9px}.measurement-hub__financial strong{display:block;margin-top:3px;font-size:12px}.measurement-hub__origins>header{margin-bottom:8px}.measurement-hub__origins>header strong{font-size:13px}.measurement-hub__origins>header span{display:block;color:#6b7280;margin-top:2px}.measurement-hub__origin-list{display:grid;gap:6px}.measurement-hub__origin-list button{display:flex!important;align-items:center!important;justify-content:space-between!important;width:100%!important;border:1px solid #d1d5db!important;border-radius:8px!important;padding:9px!important;background:#fff!important;color:#111827!important;text-align:left!important}.measurement-hub__origin-list button span{display:block}.measurement-hub__origin-list button strong{display:block}.measurement-hub__origin-list button small{display:block;color:#6b7280;margin-top:2px}.measurement-hub__origin-list button b{font-size:11px}.measurement-hub__empty{padding:12px;border:1px dashed #d1d5db;border-radius:8px;color:#6b7280}
      @page{size:A4 portrait;margin:12mm}@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}.print-page{padding:0}}
    </style></head><body><main class="print-page"><header class="print-head"><img src="${logo}" alt="Gestão 3.0"><div class="print-head__meta"><strong>Medição ${header.measurementNumber||'—'}</strong><span>${statusLabel}</span></div></header>${clone.outerHTML}</main></body></html>`);
    doc.close();
    const run=()=>{try{frame.contentWindow?.focus();frame.contentWindow?.print();}finally{window.setTimeout(()=>frame.remove(),1500);}};
    const image=doc.querySelector('img');
    if(image&&!image.complete){image.addEventListener('load',()=>window.setTimeout(run,100),{once:true});image.addEventListener('error',()=>window.setTimeout(run,100),{once:true});}
    else window.setTimeout(run,150);
  }
'''
          if 'function printMeasurement()' not in s:
              if anchor not in s: raise SystemExit('closeFlow anchor not found')
              s=s.replace(anchor,fn+anchor,1)
          s=s.replace('onClick={()=>window.print()}>⎙ Imprimir medição</Button>','onClick={printMeasurement}>⎙ Imprimir medição</Button>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate build
        run: npm install --no-package-lock && npm run build
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/engineering/ui/GuidedMeasurementFlow.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(engineering): render measurement print in isolated document'
          git pull --rebase origin main
          git push origin HEAD:main